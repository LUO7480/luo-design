name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'study-lock-android/app/**'
      - 'study-lock-android/tests/**'
      - 'study-lock-android/*.gradle'
      - 'study-lock-android/gradle.properties'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test and build native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: study-lock-android
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Ensure Android 16 SDK is available
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Verify schedule and automatic release rules
        run: |
          mkdir -p build/checks
          javac -encoding UTF-8 -d build/checks app/src/main/java/cn/studylock/Schedule.java app/src/main/java/cn/studylock/SessionTimes.java tests/ScheduleTest.java
          java -cp build/checks ScheduleTest

      - name: Build installable debug APK
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Verify APK signature and prepare download
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cd dist
          sha256sum app-debug.apk > app-debug.apk.sha256
          printf 'APK size: %s bytes\n' "$(stat -c %s app-debug.apk)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StudyLock-Android16-APK
          path: |
            study-lock-android/dist/app-debug.apk
            study-lock-android/dist/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Show download link
        env:
          APK_DOWNLOAD_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '\n[Download APK archive](%s)\n\nSign in to GitHub, download the ZIP, and extract app-debug.apk.\n' "$APK_DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
