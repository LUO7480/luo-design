<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="联系沃尔森光电，获取产品目录、报价和渠道合作信息。"><title>联系我们｜沃尔森光电</title><link rel="stylesheet" href="styles.css"></head><body data-page="contact"><a class="skip-link" href="#main">跳转到主要内容</a><header class="site-header" data-site-header></header><main id="main"><section class="page-hero"><div class="container"><span class="eyebrow">CONTACT WARSUN</span><h1>准备好，<br>一起点亮下一步。</h1><p>无论是经销合作、工程采购、产品咨询还是定制需求，都欢迎与我们沟通。</p></div></section><section class="section" id="inquiry"><div class="container form-wrap"><div><span class="eyebrow">START A CONVERSATION</span><h2 class="section-title">让我们听见<br>你的需求。</h2><p class="section-copy">填写基本信息后，我们会在正式提交接口接入后根据需求与你联系。</p><div style="margin-top:2rem"><p class="section-copy">服务方向</p><p>经销商合作 · 工程采购 · 获取报价 · 产品目录 · OEM/ODM</p></div></div><div class="form-card"><p id="inquiry-context" class="section-copy">咨询信息</p><form id="inquiry-form"><div class="form-grid"><div class="field"><label for="name">联系人 *</label><input id="name" name="name" required><span class="field-error" data-error-for="name"></span></div><div class="field"><label for="company">公司名称 *</label><input id="company" name="company" required><span class="field-error" data-error-for="company"></span></div><div class="field"><label for="phone">联系电话 *</label><input id="phone" name="phone" required><span class="field-error" data-error-for="phone"></span></div><div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email"><span class="field-error" data-error-for="email"></span></div><div class="field field-full"><label for="interest">咨询方向 *</label><select id="interest" name="interest" required><option value="">请选择</option><option>经销商合作</option><option>区域代理</option><option>工程采购</option><option>获取报价</option><option>获取产品目录</option><option>OEM/ODM</option><option>售后服务</option></select><span class="field-error" data-error-for="interest"></span></div><div class="field field-full"><label for="message">具体需求</label><textarea id="message" name="message" placeholder="可以简单描述你的市场、产品或项目需求"></textarea><span class="field-error" data-error-for="message"></span></div></div><button class="btn btn-primary" type="submit">提交咨询 <span>→</span></button><p class="form-status" id="form-status" role="status" aria-live="polite"></p></form></div></div></section></main><footer class="footer" data-site-footer></footer><script type="module" src="js/site.js"></script></body></html>
